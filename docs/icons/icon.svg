<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing accent shield ring -->
  <path d="M256 64 L416 128 C416 296 256 424 256 448 C256 424 96 296 96 128 Z" 
        fill="none" stroke="#60a5fa" stroke-width="8" opacity="0.4" filter="url(#glow)"/>

  <!-- Main Shield -->
  <path d="M256 80 L396 136 C396 288 256 400 256 424 C256 400 116 288 116 136 Z" 
        fill="url(#shieldGrad)"/>

  <!-- Inner Shading -->
  <path d="M256 80 L396 136 C396 288 256 400 256 424 Z" 
        fill="#ffffff" opacity="0.12"/>

  <!-- Circuit & Core Lock Symbol -->
  <!-- Circuit Nodes -->
  <circle cx="256" cy="190" r="14" fill="#ffffff" />
  <circle cx="196" cy="280" r="10" fill="#93c5fd" />
  <circle cx="316" cy="280" r="10" fill="#93c5fd" />
  <circle cx="256" cy="330" r="12" fill="#ffffff" />

  <!-- Circuit Lines -->
  <line x1="256" y1="190" x2="196" y2="280" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="190" x2="316" y2="280" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="196" y1="280" x2="256" y2="330" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="316" y1="280" x2="256" y2="330" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Center Pulse Dot -->
  <circle cx="256" cy="255" r="18" fill="#38bdf8" />
  <circle cx="256" cy="255" r="8" fill="#ffffff" />
</svg>
