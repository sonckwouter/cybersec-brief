name: Daily Cyber Security Brief & PWA

on:
  schedule:
    # Runs everyday at 07:00 UTC (which is 08:00 AM CET Brussels/Amsterdam time)
    # The scan completes in ~1 minute so the latest news is published right at 8:00 AM!
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to run (matches config/feeds.yaml)'
        required: true
        default: 'cyber_security'
      send_email:
        description: 'Also send email newsletter (requires SMTP secrets)'
        type: boolean
        required: false
        default: false

# Permissions for Pages deployment and data commit
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Morning News Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          CMD="python main.py"
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.topic }}" ]; then
              CMD="$CMD --topic ${{ github.event.inputs.topic }}"
            fi
            if [ "${{ github.event.inputs.send_email }}" = "true" ]; then
              CMD="$CMD --send-email"
            fi
          fi
          
          echo "Executing: $CMD"
          $CMD

      - name: Commit and push updated web app data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(data): update daily intelligence feed [skip ci]"
            git push
          else
            echo "No data changes to commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
