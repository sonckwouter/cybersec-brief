name: Daily Cyber Security Newsletter

on:
  schedule:
    # Runs everyday at 06:00 UTC (07:00 CET in winter / 08:00 CEST in summer)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic to run (matches config/feeds.yaml)'
        required: true
        default: 'cyber_security'
      dry_run:
        description: 'Dry run (curate only, do not send email)'
        type: boolean
        required: false
        default: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Morning News Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          CMD="python main.py"
          
          # Handle manual workflow_dispatch parameters
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ github.event.inputs.topic }}" ]; then
              CMD="$CMD --topic ${{ github.event.inputs.topic }}"
            fi
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              CMD="$CMD --dry-run"
            fi
          fi
          
          echo "Executing: $CMD"
          $CMD
